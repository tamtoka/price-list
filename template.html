<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прайс-лист</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }
    </style>
</head>
<body>
    <h1>Прайс-лист</h1>

    <table>
        <thead>
            <tr>
                <th>Товар</th>
                <th>Цена, ₽</th>
                <th>Количество</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.product }}</td>
                <td>{{ item.price }}</td>
                <td>{{ item.qty }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
